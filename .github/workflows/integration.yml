name: Integration Tests

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  integration:
    name: Drift + Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Export Supabase test credentials
        run: |
          eval "$(supabase status -o env)"
          url="${API_URL:-$SUPABASE_URL}"
          anon_key="${ANON_KEY:-$PUBLISHABLE_KEY}"
          if [ -z "$url" ] || [ -z "$anon_key" ]; then
            echo "Não foi possível obter API_URL/ANON_KEY de 'supabase status -o env'." >&2
            exit 1
          fi
          {
            echo "SUPABASE_TEST_URL=$url"
            echo "SUPABASE_TEST_ANON_KEY=$anon_key"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests
        run: flutter test test/integration/
