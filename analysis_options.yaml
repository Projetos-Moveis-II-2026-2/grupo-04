analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include: package:flutter_lints/flutter.yaml

# riverpod_lint usa o mecanismo novo (analysis_server_plugin, Dart 3.10+):
# bloco `plugins` na RAIZ, formato mapa nome:restrição — o mesmo do pubspec.
# O formato legado (lista dentro de `analyzer:`) é do protocolo antigo
# (custom_lint) e não se aplica aqui.
# Obs.: os diagnostics do plugin aparecem em `dart analyze` e na IDE;
# `flutter analyze` ainda não os exibe.
plugins:
  riverpod_lint: ^3.1.0
